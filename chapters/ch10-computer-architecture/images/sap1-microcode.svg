<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" role="img" aria-label="SAP-1 micro operations for each T state, shared fetch phase and per instruction execute phase">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="900" height="496" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">ทุกคำสั่งใช้ 6 จังหวะ — สามจังหวะแรกเหมือนกันหมด ต่างกันแค่สามจังหวะหลัง</text>
  <text x="300" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">LDA</text>
  <text x="460" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">ADD / SUB</text>
  <text x="640" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">OUT</text>
  <text x="790" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">HLT</text>
  <rect x="120" y="86" width="760" height="166" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="144" y="106" text-anchor="start" font-size="10.5" font-weight="700" fill="#4f46e5">Fetch — เหมือนกันทุกคำสั่ง</text>
  <rect x="120" y="268" width="760" height="166" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="144" y="288" text-anchor="start" font-size="10.5" font-weight="700" fill="#b45309">Execute — ต่างกันตามคำสั่ง</text>
  <text x="148" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">T1</text>
  <line x1="136" y1="152" x2="868" y2="152" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="148" y="184" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">T2</text>
  <line x1="136" y1="198" x2="868" y2="198" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="148" y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">T3</text>
  <text x="148" y="320" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">T4</text>
  <line x1="136" y1="334" x2="868" y2="334" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="148" y="366" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">T5</text>
  <line x1="136" y1="380" x2="868" y2="380" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="148" y="412" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">T6</text>
  <text x="494" y="138" text-anchor="middle" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#4f46e5">MAR ← PC</text>
  <text x="494" y="184" text-anchor="middle" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#4f46e5">PC ← PC + 1</text>
  <text x="494" y="230" text-anchor="middle" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#4f46e5">IR ← RAM[MAR]</text>
  <text x="300" y="320" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#4f46e5">MAR ← IR[3:0]</text>
  <text x="460" y="320" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#4f46e5">MAR ← IR[3:0]</text>
  <text x="640" y="320" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#16a34a">OUT ← A</text>
  <text x="790" y="320" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">หยุดนาฬิกา</text>
  <text x="300" y="366" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#16a34a">A ← RAM[MAR]</text>
  <text x="460" y="366" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#4f46e5">B ← RAM[MAR]</text>
  <text x="640" y="366" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">—</text>
  <text x="790" y="366" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">—</text>
  <text x="300" y="412" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">—</text>
  <text x="460" y="412" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#16a34a">A ← A ± B</text>
  <text x="640" y="412" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">—</text>
  <text x="790" y="412" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">—</text>
  <text x="450" y="466" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">LDA ใช้จริง 5 จังหวะ · ADD/SUB ใช้ครบ 6 · OUT ใช้ 4 — แต่ SAP-1 จองไว้ 6 จังหวะเท่ากันหมด เพื่อให้วงจรควบคุมง่ายที่สุด</text>
</svg>
