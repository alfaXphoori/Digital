<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" role="img" aria-label="Comparison of PROM, PLA and PAL array structures">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="760" height="268" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect x="12" y="8" width="236" height="208" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="130" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PROM</text>
  <text x="130" y="50" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">Fixed AND  /  Programmable OR</text>
  <text x="28" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">IN</text>
  <path d="M22,108 L44,108" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
  <rect x="46" y="76" width="76" height="64" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="84" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">AND array</text>
  <text x="84" y="120" text-anchor="middle" font-size="8.6" font-weight="700" fill="#94a3b8">FIXED</text>
  <path d="M124,108 L142,108" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
  <rect x="144" y="76" width="76" height="64" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="182" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">OR array</text>
  <text x="182" y="120" text-anchor="middle" font-size="8.6" font-weight="700" fill="#4f46e5">PROGRAMMABLE</text>
  <path d="M222,108 L240,108" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
  <text x="234" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">OUT</text>
  <text x="130" y="168" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">all 2ⁿ minterms are decoded</text>
  <line x1="42" y1="182" x2="218" y2="182" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <text x="130" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">F = Σ (product terms)</text>
  <rect x="262" y="8" width="236" height="208" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="380" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PLA</text>
  <text x="380" y="50" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">Programmable AND  /  Programmable OR</text>
  <text x="278" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">IN</text>
  <path d="M272,108 L294,108" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
  <rect x="296" y="76" width="76" height="64" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="334" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">AND array</text>
  <text x="334" y="120" text-anchor="middle" font-size="8.6" font-weight="700" fill="#4f46e5">PROGRAMMABLE</text>
  <path d="M374,108 L392,108" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
  <rect x="394" y="76" width="76" height="64" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="432" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">OR array</text>
  <text x="432" y="120" text-anchor="middle" font-size="8.6" font-weight="700" fill="#4f46e5">PROGRAMMABLE</text>
  <path d="M472,108 L490,108" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
  <text x="484" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">OUT</text>
  <text x="380" y="168" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">product terms can be shared</text>
  <line x1="292" y1="182" x2="468" y2="182" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <text x="380" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">F = Σ (product terms)</text>
  <rect x="512" y="8" width="236" height="208" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="630" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PAL</text>
  <text x="630" y="50" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">Programmable AND  /  Fixed OR</text>
  <text x="528" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">IN</text>
  <path d="M522,108 L544,108" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
  <rect x="546" y="76" width="76" height="64" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="584" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">AND array</text>
  <text x="584" y="120" text-anchor="middle" font-size="8.6" font-weight="700" fill="#4f46e5">PROGRAMMABLE</text>
  <path d="M624,108 L642,108" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
  <rect x="644" y="76" width="76" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="682" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">OR array</text>
  <text x="682" y="120" text-anchor="middle" font-size="8.6" font-weight="700" fill="#b45309">FIXED</text>
  <path d="M722,108 L740,108" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
  <text x="734" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">OUT</text>
  <text x="630" y="168" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">fastest — one programmable layer</text>
  <line x1="542" y1="182" x2="718" y2="182" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <text x="630" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">F = Σ (product terms)</text>
  <rect x="150" y="232" width="16" height="16" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="174" y="245" text-anchor="start" font-size="11" font-weight="400" fill="#475569">Programmable layer</text>
  <rect x="370" y="232" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="394" y="245" text-anchor="start" font-size="11" font-weight="400" fill="#475569">Fixed layer</text>
</svg>
