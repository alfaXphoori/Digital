<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 408" width="840" height="408" role="img" aria-label="FPGA routing switch matrix where each cross point is a pass transistor controlled by a configuration flip-flop">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="840" height="408" fill="#ffffff"/>
  <defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="420" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Even the wiring is programmable: every switch has its own flip-flop</text>
  <rect x="16" y="52" width="380" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="206" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Switch matrix — one switch per cross-point</text>
  <line x1="70" y1="130" x2="360" y2="130" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="186" x2="360" y2="186" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="242" x2="360" y2="242" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="100" x2="140" y2="292" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="216" y1="100" x2="216" y2="292" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="292" y1="100" x2="292" y2="292" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <text x="62" y="134" text-anchor="end" font-size="9.5" font-weight="700" fill="#475569">H0</text>
  <circle cx="140" cy="130" r="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/>
  <circle cx="216" cy="130" r="5.4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="292" cy="130" r="5.4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="62" y="190" text-anchor="end" font-size="9.5" font-weight="700" fill="#475569">H1</text>
  <circle cx="140" cy="186" r="5.4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="216" cy="186" r="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/>
  <circle cx="292" cy="186" r="5.4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="62" y="246" text-anchor="end" font-size="9.5" font-weight="700" fill="#475569">H2</text>
  <circle cx="140" cy="242" r="5.4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="216" cy="242" r="5.4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="292" cy="242" r="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/>
  <text x="140" y="94" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">V0</text>
  <text x="216" y="94" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">V1</text>
  <text x="292" y="94" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">V2</text>
  <circle cx="96" cy="312" r="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/>
  <text x="108" y="316" text-anchor="start" font-size="9.5" font-weight="400" fill="#475569">cfg = 1 → closed</text>
  <circle cx="236" cy="312" r="5.4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="248" y="316" text-anchor="start" font-size="9.5" font-weight="400" fill="#475569">cfg = 0 → open</text>
  <text x="206" y="338" text-anchor="middle" font-size="9.5" font-weight="600" fill="#b45309">9 cross-points → 9 configuration flip-flops</text>
  <rect x="412" y="52" width="412" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="618" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Zoom: what one cross-point really is</text>
  <line x1="452" y1="132" x2="600" y2="132" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <text x="446" y="136" text-anchor="end" font-size="11" font-weight="700" fill="#16a34a">H</text>
  <line x1="600" y1="132" x2="600" y2="152" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <line x1="600" y1="152" x2="648" y2="152" stroke="#334155" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="648" y1="152" x2="648" y2="132" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <line x1="648" y1="132" x2="736" y2="132" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <line x1="736" y1="96" x2="736" y2="216" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="736" cy="132" r="4" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="736" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">V</text>
  <line x1="600" y1="168" x2="648" y2="168" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="624" y1="168" x2="624" y2="246" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>
  <text x="624" y="200" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569" stroke="#ffffff" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">NMOS pass transistor</text>
  <text x="660" y="148" text-anchor="start" font-size="8.5" font-weight="400" fill="#475569">channel</text>
  <text x="660" y="174" text-anchor="start" font-size="8.5" font-weight="400" fill="#475569">gate</text>
  <rect x="580" y="246.0" width="88" height="40" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="602" y="262" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">cfg</text>
  <text x="638" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">1</text>
  <path d="M580,276 L590,281 L580,286" fill="none" stroke="#b45309" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="618" y="326" text-anchor="middle" font-size="9.5" font-weight="600" fill="#b45309">a stored 1 turns the transistor on and welds H to V</text>
  <text x="420" y="386" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Logic, storage and wiring are all held by the same thing — flip-flops loaded from the bitstream at power-up.</text>
</svg>
