  <line x1="300" y1="238" x2="300" y2="256" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="273" y="256" width="54" height="30" rx="5" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="300" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">D1</text>
  <line x1="420" y1="160" x2="420" y2="194" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="411.0" y="194.0" width="18" height="44" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="442.0" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">2R</text>
  <line x1="420" y1="238" x2="420" y2="256" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="393" y="256" width="54" height="30" rx="5" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="420" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">D2</text>
  <line x1="540" y1="160" x2="540" y2="194" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="531.0" y="194.0" width="18" height="44" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="562.0" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">2R</text>
  <line x1="540" y1="238" x2="540" y2="256" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="513" y="256" width="54" height="30" rx="5" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="540" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">D3</text>
  <text x="540" y="302" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">(MSB)</text>
  <line x1="540" y1="160" x2="600" y2="160" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M600,133.0 L658,160 L600,187.0 Z" fill="#ffffff" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="620" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">×1</text>
  <text x="629" y="204" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">buffer</text>
  <line x1="658" y1="160" x2="716" y2="160" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="724" y="165" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">Vout</text>
  <rect x="500" y="62" width="268" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="634" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">Vout = Vref × D / 2ⁿ</text>
  <text x="634" y="108" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">step size = Vref / 2ⁿ</text>
  <text x="300" y="324" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">each bit switches its 2R to Vref (logic 1) or to 0 V (logic 0)</text>
</svg>
