  <line x1="70" y1="160" x2="92" y2="160" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="92.0" y="151.0" width="46" height="18" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="115" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">2R</text>
  <line x1="138" y1="160" x2="180" y2="160" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="180" cy="160" r="4" fill="#334155" stroke="none" stroke-width="1.4"/>
  <line x1="180" y1="160" x2="217.0" y2="160" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="217.0" y="151.0" width="46" height="18" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="240.0" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">R</text>
  <line x1="263.0" y1="160" x2="300" y2="160" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="300" cy="160" r="4" fill="#334155" stroke="none" stroke-width="1.4"/>
  <line x1="300" y1="160" x2="337.0" y2="160" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
