<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 350" width="790" height="350" role="img" aria-label="Four-bit R-2R ladder digital to analog converter">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="790" height="350" fill="#ffffff"/>
  <defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="395" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">4-bit R-2R ladder DAC — only two resistor values are ever needed</text>
  <line x1="70" y1="160" x2="70" y2="170" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="61.0" y1="170" x2="79.0" y2="170" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="64.42" y1="175" x2="75.58" y2="175" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
