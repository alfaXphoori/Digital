  <circle cx="420" cy="160" r="4" fill="#334155" stroke="none" stroke-width="1.4"/>
  <line x1="420" y1="160" x2="457.0" y2="160" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="457.0" y="151.0" width="46" height="18" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="480.0" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">R</text>
  <line x1="503.0" y1="160" x2="540" y2="160" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="540" cy="160" r="4" fill="#334155" stroke="none" stroke-width="1.4"/>
  <line x1="180" y1="160" x2="180" y2="194" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="171.0" y="194.0" width="18" height="44" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="202.0" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">2R</text>
  <line x1="180" y1="238" x2="180" y2="256" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="153" y="256" width="54" height="30" rx="5" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="180" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">D0</text>
  <text x="180" y="302" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">(LSB)</text>
  <line x1="300" y1="160" x2="300" y2="194" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="291.0" y="194.0" width="18" height="44" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
