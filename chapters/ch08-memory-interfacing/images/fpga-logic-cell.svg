<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-label="Complete FPGA logic cell showing the look-up table, data flip-flop, output multiplexer and configuration bits">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="880" height="392" fill="#ffffff"/>
  <defs><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="440" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">One FPGA logic cell = LUT + flip-flop + output multiplexer</text>
  <path d="M72,112 L118,112" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#al)"/>
  <text x="64" y="116" text-anchor="end" font-size="11.5" font-weight="700" fill="#4f46e5">A</text>
  <path d="M72,138 L118,138" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#al)"/>
  <text x="64" y="142" text-anchor="end" font-size="11.5" font-weight="700" fill="#4f46e5">B</text>
  <path d="M72,164 L118,164" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#al)"/>
  <text x="64" y="168" text-anchor="end" font-size="11.5" font-weight="700" fill="#4f46e5">C</text>
  <path d="M72,190 L118,190" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#al)"/>
  <text x="64" y="194" text-anchor="end" font-size="11.5" font-weight="700" fill="#4f46e5">D</text>
  <rect x="118" y="96" width="140" height="110" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="188" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">4-input LUT</text>
  <text x="188" y="154" text-anchor="middle" font-size="9.5" font-weight="400" fill="#b45309">16 configuration</text>
  <text x="188" y="168" text-anchor="middle" font-size="9.5" font-weight="400" fill="#b45309">flip-flops</text>
  <text x="188" y="190" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">= any 4-input function</text>
  <line x1="258" y1="151" x2="292" y2="151" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="292" cy="151" r="3.4" fill="#334155" stroke="none" stroke-width="1.4"/>
  <line x1="292" y1="151" x2="292" y2="138" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="292" y1="138" x2="336" y2="138" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="336" y="112" width="94" height="56" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="349" y="133.28" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">D</text>
  <text x="417" y="133.28" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Q</text>
  <path d="M336,152 L346,158 L336,164" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="383" y="186" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">data flip-flop</text>
  <line x1="430" y1="138" x2="486" y2="138" stroke="#16a34a" stroke-width="1.7" stroke-linecap="round"/>
  <line x1="292" y1="151" x2="292" y2="250" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="292" y1="250" x2="486" y2="250" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="478" y="130" text-anchor="end" font-size="9" font-weight="400" fill="#475569">registered</text>
  <text x="478" y="242" text-anchor="end" font-size="9" font-weight="400" fill="#475569">combinational</text>
  <path d="M486,124.0 L532,142.0 L532,246.0 L486,264.0 Z" fill="#ffffff" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="509" y="198" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">MUX</text>
  <rect x="464" y="296.0" width="90" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="486" y="310" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">S</text>
  <text x="522" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">1</text>
  <path d="M464,324 L474,329 L464,334" fill="none" stroke="#b45309" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="509" y1="296" x2="509" y2="264" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>
  <text x="509" y="352" text-anchor="middle" font-size="9" font-weight="600" fill="#b45309">mode bit: registered or not</text>
  <path d="M532,194 L610,194" fill="none" stroke="#16a34a" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#al)"/>
  <text x="572" y="184" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">cell output</text>
  <rect x="610" y="168" width="112" height="52" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="666" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">routing</text>
  <text x="666" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">matrix</text>
  <path d="M312,330 L312,158 L336,158" fill="none" stroke="#334155" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#al)"/>
  <text x="312" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">CLK</text>
  <rect x="748" y="96" width="116" height="186" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="806" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">flip-flops</text>
  <text x="806" y="136" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">in this one cell</text>
  <text x="772" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">16</text>
  <text x="792" y="168" text-anchor="start" font-size="9.5" font-weight="400" fill="#475569">LUT bits</text>
  <text x="772" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">1</text>
  <text x="792" y="198" text-anchor="start" font-size="9.5" font-weight="400" fill="#475569">mode bit</text>
  <text x="772" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">1</text>
  <text x="792" y="228" text-anchor="start" font-size="9.5" font-weight="400" fill="#475569">data FF</text>
  <line x1="762" y1="250" x2="852" y2="250" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <text x="806" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">18 in total</text>
  <text x="440" y="378" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">An FPGA with 100,000 cells therefore contains roughly 1.8 million flip-flops — and the bitstream is simply their values.</text>
</svg>
