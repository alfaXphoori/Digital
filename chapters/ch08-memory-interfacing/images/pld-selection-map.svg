<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 566" width="880" height="566" role="img" aria-label="Everyday devices grouped by whether they need state and whether a PAL or GAL can hold them">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="880" height="566" fill="#ffffff"/>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="440" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">เลือก PLD อย่างไร — วางอุปกรณ์รอบตัวลงบนแผนที่</text>
  <rect x="168" y="84" width="300" height="248" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="318.0" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Registered PAL / GAL</text>
  <text x="318.0" y="128" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">มีฟลิปฟลอปและเส้น feedback</text>
  <line x1="186" y1="140" x2="450" y2="140" stroke="#16a34a" stroke-width="1" stroke-linecap="round"/>
  <circle cx="194" cy="152" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="156" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ปั๊มน้ำอัตโนมัติ</text>
  <circle cx="194" cy="176" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="180" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">เครื่องซักผ้า</text>
  <circle cx="194" cy="200" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="204" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ที่ปัดน้ำฝนหน่วงเวลา</text>
  <circle cx="194" cy="224" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="228" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">แอร์ / ตู้เย็น</text>
  <circle cx="194" cy="248" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="252" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ไฟจราจรสี่แยก</text>
  <circle cx="194" cy="272" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="276" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ป้ายไฟ LED วิ่ง</text>
  <circle cx="194" cy="296" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="300" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">รีโมทประตูรั้ว</text>
  <rect x="168" y="344" width="300" height="134" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="318.0" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#4f46e5">PAL / GAL / PROM</text>
  <text x="318.0" y="388" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">เร็ว ถูก หน่วงเวลาแน่นอน</text>
  <line x1="186" y1="400" x2="450" y2="400" stroke="#4f46e5" stroke-width="1" stroke-linecap="round"/>
  <circle cx="194" cy="412" r="3.6" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <text x="206" y="416" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">เตาไมโครเวฟ</text>
  <circle cx="194" cy="436" r="3.6" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <text x="206" y="440" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ระบบเตือนในรถยนต์</text>
  <circle cx="194" cy="460" r="3.6" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <text x="206" y="464" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">วงจรถอดรหัส 7-segment</text>
  <rect x="500" y="84" width="358" height="394" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="679.0" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">เกินกำลัง PAL / GAL</text>
  <text x="679.0" y="128" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">product term เกินร้อย หรือแมโครเซลล์ไม่พอ</text>
  <line x1="518" y1="140" x2="840" y2="140" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <circle cx="526" cy="152" r="3.6" fill="#94a3b8" stroke="none" stroke-width="1.4"/>
  <text x="538" y="156" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ลิฟต์ (จำคำขอทุกชั้น)</text>
  <circle cx="526" cy="176" r="3.6" fill="#94a3b8" stroke="none" stroke-width="1.4"/>
  <text x="538" y="180" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ตู้กดน้ำหยอดเหรียญ</text>
  <circle cx="526" cy="200" r="3.6" fill="#94a3b8" stroke="none" stroke-width="1.4"/>
  <text x="538" y="204" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">เครื่องคิดเงินหน้าร้าน</text>
  <circle cx="526" cy="224" r="3.6" fill="#94a3b8" stroke="none" stroke-width="1.4"/>
  <text x="538" y="228" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">เราเตอร์ / กล้องวงจรปิด</text>
  <circle cx="526" cy="248" r="3.6" fill="#94a3b8" stroke="none" stroke-width="1.4"/>
  <text x="538" y="252" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ระบบประมวลผลภาพเรียลไทม์</text>
  <text x="679" y="452" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569">อยู่นอกขอบเขตของบทนี้</text>
  <path d="M132,486 L132,74" fill="none" stroke="#334155" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#am)"/>
  <text x="154" y="208" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a" transform="rotate(-90 154 208)">ต้องจำสถานะ (Sequential)</text>
  <text x="154" y="411" text-anchor="middle" font-size="10" font-weight="700" fill="#4f46e5" transform="rotate(-90 154 411)">ไม่ต้องจำ (Combinational)</text>
  <path d="M132,498 L862,498" fill="none" stroke="#334155" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#am)"/>
  <text x="858" y="516" text-anchor="end" font-size="9.5" font-weight="700" fill="#475569">ความซับซ้อนมากขึ้น →</text>
  <rect x="132" y="530" width="730" height="28" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="497" y="549" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">ถามตัวเอง 2 ข้อ: วงจรนี้ต้อง "จำ" อะไรไหม  ·  มีกี่ product term และกี่แมโครเซลล์</text>
</svg>
