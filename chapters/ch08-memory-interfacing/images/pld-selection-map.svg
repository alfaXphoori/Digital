<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img" aria-label="Everyday devices grouped by whether they need state and how complex they are, with the matching PLD family">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="900" height="590" fill="#ffffff"/>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">เลือก PLD อย่างไร — วางอุปกรณ์รอบตัวลงบนแผนที่</text>
  <rect x="168" y="84" width="268" height="248" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="302.0" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Registered PAL / GAL</text>
  <text x="302.0" y="128" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">มีฟลิปฟลอปและเส้น feedback</text>
  <line x1="186" y1="140" x2="418" y2="140" stroke="#16a34a" stroke-width="1" stroke-linecap="round"/>
  <circle cx="194" cy="152" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="156" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ปั๊มน้ำอัตโนมัติ</text>
  <circle cx="194" cy="176" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="180" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">เครื่องซักผ้า</text>
  <circle cx="194" cy="200" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="204" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ที่ปัดน้ำฝนหน่วงเวลา</text>
  <circle cx="194" cy="224" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="228" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">แอร์ / ตู้เย็น</text>
  <circle cx="194" cy="248" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="252" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ไฟจราจรสี่แยก</text>
  <circle cx="194" cy="272" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="276" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ป้ายไฟ LED วิ่ง</text>
  <circle cx="194" cy="296" r="3.6" fill="#16a34a" stroke="none" stroke-width="1.4"/>
  <text x="206" y="300" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">รีโมทประตูรั้ว</text>
  <rect x="168" y="344" width="268" height="134" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="302.0" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#4f46e5">PAL / GAL / PROM</text>
  <text x="302.0" y="388" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">เร็ว ถูก หน่วงเวลาแน่นอน</text>
  <line x1="186" y1="400" x2="418" y2="400" stroke="#4f46e5" stroke-width="1" stroke-linecap="round"/>
  <circle cx="194" cy="412" r="3.6" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <text x="206" y="416" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">เตาไมโครเวฟ</text>
  <circle cx="194" cy="436" r="3.6" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <text x="206" y="440" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ระบบเตือนในรถยนต์</text>
  <circle cx="194" cy="460" r="3.6" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <text x="206" y="464" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">วงจรถอดรหัส 7-segment</text>
  <rect x="452" y="84" width="196" height="394" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="550.0" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">CPLD</text>
  <text x="550.0" y="128" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">สถานะเยอะ นับพันเกต</text>
  <line x1="470" y1="140" x2="630" y2="140" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>
  <circle cx="478" cy="152" r="3.6" fill="#b45309" stroke="none" stroke-width="1.4"/>
  <text x="490" y="156" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ลิฟต์</text>
  <circle cx="478" cy="176" r="3.6" fill="#b45309" stroke="none" stroke-width="1.4"/>
  <text x="490" y="180" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ตู้กดน้ำหยอดเหรียญ</text>
  <circle cx="478" cy="200" r="3.6" fill="#b45309" stroke="none" stroke-width="1.4"/>
  <text x="490" y="204" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">เครื่องคิดเงินหน้าร้าน</text>
  <text x="550.0" y="460" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">ครอบคลุมได้ทั้งสองแบบ</text>
  <rect x="664" y="84" width="194" height="394" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="761.0" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">FPGA</text>
  <text x="761.0" y="128" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">ประมวลผลเป็นสตรีม</text>
  <line x1="682" y1="140" x2="840" y2="140" stroke="#dc2626" stroke-width="1" stroke-linecap="round"/>
  <circle cx="690" cy="152" r="3.6" fill="#dc2626" stroke="none" stroke-width="1.4"/>
  <text x="702" y="156" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">เราเตอร์</text>
  <circle cx="690" cy="176" r="3.6" fill="#dc2626" stroke="none" stroke-width="1.4"/>
  <text x="702" y="180" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">กล้องวงจรปิด</text>
  <circle cx="690" cy="200" r="3.6" fill="#dc2626" stroke="none" stroke-width="1.4"/>
  <text x="702" y="204" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">การ์ดจอ / AI accelerator</text>
  <text x="761.0" y="460" text-anchor="middle" font-size="9" font-weight="400" fill="#475569">ครอบคลุมได้ทั้งสองแบบ</text>
  <path d="M132,486 L132,74" fill="none" stroke="#334155" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#am)"/>
  <text x="154" y="208" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a" transform="rotate(-90 154 208)">ต้องจำสถานะ (Sequential)</text>
  <text x="154" y="411" text-anchor="middle" font-size="10" font-weight="700" fill="#4f46e5" transform="rotate(-90 154 411)">ไม่ต้องจำ (Combinational)</text>
  <path d="M132,498 L862,498" fill="none" stroke="#334155" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#am)"/>
  <text x="858" y="516" text-anchor="end" font-size="9.5" font-weight="700" fill="#475569">ความซับซ้อนมากขึ้น →</text>
  <rect x="132" y="530" width="730" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="160" y="550" text-anchor="start" font-size="10" font-weight="400" fill="#475569">1. วงจรนี้ต้อง "จำ" อะไรไว้หรือไม่ — ถ้าต้อง ต้องมีฟลิปฟลอปและเส้น feedback</text>
  <text x="160" y="570" text-anchor="start" font-size="10" font-weight="400" fill="#475569">2. มีกี่ product term — ไม่กี่สิบใช้ PAL/GAL · นับพันใช้ CPLD · ประมวลผลเป็นสตรีมใช้ FPGA</text>
</svg>
