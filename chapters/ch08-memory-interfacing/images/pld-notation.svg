<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img" aria-label="PLD simplified cross-point notation compared with a conventional AND gate">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="760" height="272" fill="#ffffff"/>
  <rect x="12" y="8" width="340" height="206" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="182" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Conventional gate notation</text>
  <text x="52" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">A</text>
  <line x1="64" y1="80" x2="168" y2="80" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="168" cy="80" r="3.2" fill="#334155" stroke="none" stroke-width="1.4"/>
  <text x="52" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">B'</text>
  <line x1="64" y1="112" x2="168" y2="112" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="168" cy="112" r="3.2" fill="#334155" stroke="none" stroke-width="1.4"/>
  <text x="52" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">C</text>
  <line x1="64" y1="144" x2="168" y2="144" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="168" cy="144" r="3.2" fill="#334155" stroke="none" stroke-width="1.4"/>
  <path d="M168,69.0 L179.0,69.0 A43.0,43.0 0 0 1 179.0,155.0 L168,155.0 Z" fill="#ffffff" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="222" y1="112" x2="288" y2="112" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="300" y="116" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">P</text>
  <text x="182" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#4f46e5">P = A · B' · C</text>
  <rect x="372" y="8" width="376" height="206" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="560" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">PLD simplified notation</text>
  <line x1="440" y1="56" x2="440" y2="160" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="440" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">A</text>
  <line x1="478" y1="56" x2="478" y2="160" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="478" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">A'</text>
  <line x1="516" y1="56" x2="516" y2="160" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="516" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">B</text>
  <line x1="554" y1="56" x2="554" y2="160" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="554" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">B'</text>
  <line x1="592" y1="56" x2="592" y2="160" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="592" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">C</text>
  <line x1="630" y1="56" x2="630" y2="160" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="630" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">C'</text>
  <line x1="408" y1="112" x2="658" y2="112" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M658,99.0 L685.0,99.0 A13.0,13.0 0 0 1 685.0,125.0 L658,125.0 Z" fill="#ffffff" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="698" y1="112" x2="726" y2="112" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="736" y="116" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">P</text>
  <path d="M434.8,106.8 L445.2,117.2 M434.8,117.2 L445.2,106.8" stroke="#4f46e5" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <path d="M548.8,106.8 L559.2,117.2 M548.8,117.2 L559.2,106.8" stroke="#4f46e5" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <path d="M586.8,106.8 L597.2,117.2 M586.8,117.2 L597.2,106.8" stroke="#4f46e5" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <text x="560" y="190" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">one line + × marks = the very same 3-input AND gate</text>
  <path d="M34.8,234.8 L45.2,245.2 M34.8,245.2 L45.2,234.8" stroke="#4f46e5" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <text x="56" y="244" text-anchor="start" font-size="11" font-weight="400" fill="#475569">× = fuse intact → this input IS connected</text>
  <line x1="370" y1="232" x2="370" y2="250" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="360" y1="241" x2="380" y2="241" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="392" y="244" text-anchor="start" font-size="11" font-weight="400" fill="#475569">plain crossing = fuse blown → NOT connected</text>
</svg>
