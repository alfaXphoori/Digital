<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 392" width="790" height="392" role="img" aria-label="Pulse width modulation waveforms at 25, 50 and 75 percent duty cycle and the drive chain">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="790" height="392" fill="#ffffff"/>
  <defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="395" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">PWM: the same digital pin delivers a different average voltage</text>
  <text x="132" y="84" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">25 %</text>
  <line x1="142" y1="96" x2="496" y2="96" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M150,96 L150,62 L170.5,62 L170.5,96 L232,96 L232,62 L252.5,62 L252.5,96 L314,96 L314,62 L334.5,62 L334.5,96 L396,96 L396,62 L416.5,62 L416.5,96 L478,96" fill="none" stroke="#4f46e5" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="150" y1="87.5" x2="488" y2="87.5" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="500" y="91.5" text-anchor="start" font-size="10.5" font-weight="700" fill="#dc2626">Vavg = 3 V</text>
  <text x="136" y="100" text-anchor="end" font-size="9.5" font-weight="400" fill="#475569">0</text>
  <text x="132" y="150" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">50 %</text>
  <line x1="142" y1="162" x2="496" y2="162" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M150,162 L150,128 L191.0,128 L191.0,162 L232,162 L232,128 L273.0,128 L273.0,162 L314,162 L314,128 L355.0,128 L355.0,162 L396,162 L396,128 L437.0,128 L437.0,162 L478,162" fill="none" stroke="#4f46e5" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="150" y1="145.0" x2="488" y2="145.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="500" y="149.0" text-anchor="start" font-size="10.5" font-weight="700" fill="#dc2626">Vavg = 6 V</text>
  <text x="136" y="166" text-anchor="end" font-size="9.5" font-weight="400" fill="#475569">0</text>
  <text x="132" y="216" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">75 %</text>
  <line x1="142" y1="228" x2="496" y2="228" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M150,228 L150,194 L211.5,194 L211.5,228 L232,228 L232,194 L293.5,194 L293.5,228 L314,228 L314,194 L375.5,194 L375.5,228 L396,228 L396,194 L457.5,194 L457.5,228 L478,228" fill="none" stroke="#4f46e5" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="150" y1="202.5" x2="488" y2="202.5" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="500" y="206.5" text-anchor="start" font-size="10.5" font-weight="700" fill="#dc2626">Vavg = 9 V</text>
  <text x="136" y="232" text-anchor="end" font-size="9.5" font-weight="400" fill="#475569">0</text>
  <text x="150" y="52" text-anchor="start" font-size="10.5" font-weight="700" fill="#475569">Vmax = 12 V</text>
  <text x="395" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f46e5">Vavg = Vmax × duty cycle</text>
  <rect x="22" y="306" width="148" height="54" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="96.0" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">MCU / Logic</text>
  <text x="96.0" y="348" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">generates the pulses</text>
  <rect x="194" y="306" width="148" height="54" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="268.0" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Opto-isolator</text>
  <text x="268.0" y="348" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">separates the grounds</text>
  <rect x="366" y="306" width="148" height="54" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="440.0" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">MOSFET driver</text>
  <text x="440.0" y="348" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">switches the power</text>
  <rect x="538" y="306" width="168" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="622.0" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">DC motor / load</text>
  <text x="622.0" y="348" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">sees only the average</text>
  <path d="M170,333 L192,333" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ap)"/>
  <path d="M342,333 L364,333" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ap)"/>
  <path d="M514,333 L536,333" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ap)"/>
</svg>
