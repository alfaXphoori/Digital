<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="A 3-input FPGA look-up table built from eight SRAM cells and an 8-to-1 multiplexer">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="720" height="440" fill="#ffffff"/>
  <defs><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="360" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Inside an FPGA: a 3-input LUT = 8 SRAM configuration bits + an 8-to-1 MUX</text>
  <text x="96" y="58" text-anchor="end" font-size="10.5" font-weight="700" fill="#475569">A B C</text>
  <text x="140" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">SRAM</text>
  <text x="96" y="86" text-anchor="end" font-size="11" font-weight="400" fill="#475569">0 0 0</text>
  <rect x="114" y="69" width="52" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
  <line x1="166" y1="82" x2="206" y2="82" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="96" y="120" text-anchor="end" font-size="11" font-weight="400" fill="#475569">0 0 1</text>
  <rect x="114" y="103" width="52" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">1</text>
  <line x1="166" y1="116" x2="206" y2="116" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="96" y="154" text-anchor="end" font-size="11" font-weight="400" fill="#475569">0 1 0</text>
  <rect x="114" y="137" width="52" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">1</text>
  <line x1="166" y1="150" x2="206" y2="150" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="96" y="188" text-anchor="end" font-size="11" font-weight="400" fill="#475569">0 1 1</text>
  <rect x="114" y="171" width="52" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
  <line x1="166" y1="184" x2="206" y2="184" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="96" y="222" text-anchor="end" font-size="11" font-weight="400" fill="#475569">1 0 0</text>
  <rect x="114" y="205" width="52" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">1</text>
  <line x1="166" y1="218" x2="206" y2="218" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="96" y="256" text-anchor="end" font-size="11" font-weight="400" fill="#475569">1 0 1</text>
  <rect x="114" y="239" width="52" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
  <line x1="166" y1="252" x2="206" y2="252" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="96" y="290" text-anchor="end" font-size="11" font-weight="400" fill="#475569">1 1 0</text>
  <rect x="114" y="273" width="52" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
  <line x1="166" y1="286" x2="206" y2="286" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="96" y="324" text-anchor="end" font-size="11" font-weight="400" fill="#475569">1 1 1</text>
  <rect x="114" y="307" width="52" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">1</text>
  <line x1="166" y1="320" x2="206" y2="320" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M206,64 L246,112 L246,300 L206,348 Z" fill="#ffffff" stroke="#334155" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="226" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">8:1</text>
  <text x="226" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">MUX</text>
  <line x1="246" y1="206" x2="316" y2="206" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <text x="326" y="211" text-anchor="start" font-size="14" font-weight="700" fill="#4f46e5">F</text>
  <path d="M226,392 L226,330" fill="none" stroke="#475569" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#al)"/>
  <path d="M218,368 L234,358" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="244" y="368" text-anchor="start" font-size="10" font-weight="700" fill="#475569">3</text>
  <text x="226" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">A, B, C  (select)</text>
  <rect x="376" y="92" width="320" height="128" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="396" y="118" text-anchor="start" font-size="11" font-weight="700" fill="#4f46e5">Loaded pattern:</text>
  <text x="396" y="142" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">F = A ⊕ B ⊕ C   (the Sum of a full adder)</text>
  <text x="396" y="170" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">Write different bits into the 8 SRAM cells and the</text>
  <text x="396" y="188" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">same hardware becomes ANY 3-input function —</text>
  <text x="396" y="206" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">always with exactly the same propagation delay.</text>
  <rect x="376" y="240" width="320" height="108" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="396" y="266" text-anchor="start" font-size="11" font-weight="700" fill="#0f172a">Rule of thumb</text>
  <text x="396" y="292" text-anchor="start" font-size="11.5" font-weight="600" fill="#4f46e5">k-input LUT  =  2ᵏ × 1 SRAM</text>
  <text x="396" y="316" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">4-input LUT = 16 bits · 6-input LUT = 64 bits</text>
  <text x="396" y="334" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">Modern FPGAs use 6-input LUTs.</text>
</svg>
