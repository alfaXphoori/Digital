<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 516" width="880" height="516" role="img" aria-label="A two bit counter mapped onto two FPGA logic cells with their look-up table contents">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="880" height="516" fill="#ffffff"/>
  <defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <defs><marker id="acf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs>
  <defs><marker id="acg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker></defs>
  <text x="440" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">A 2-bit counter built from two FPGA logic cells</text>
  <rect x="96" y="74" width="316" height="212" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="254" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Cell 0</text>
  <line x1="104" y1="138" x2="152" y2="138" stroke="#4f46e5" stroke-width="1.6" stroke-linecap="round"/>
  <text x="108" y="131" text-anchor="start" font-size="10" font-weight="700" fill="#4f46e5">Q0</text>
  <line x1="104" y1="164" x2="152" y2="164" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
  <text x="108" y="157" text-anchor="start" font-size="10" font-weight="700" fill="#475569">0</text>
  <rect x="152" y="116" width="90" height="76" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="197" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">LUT</text>
  <text x="197" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">0011</text>
  <text x="197" y="180" text-anchor="middle" font-size="8.5" font-weight="400" fill="#b45309">C₃C₂C₁C₀</text>
  <text x="197" y="212" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">F = Q0'</text>
  <line x1="242" y1="154" x2="288" y2="154" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="288" y="128" width="84" height="52" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="301" y="147.76" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">D</text>
  <text x="359" y="147.76" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Q</text>
  <path d="M288,162 L298,168 L288,174" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="372" y1="154" x2="396" y2="154" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round"/>
  <text x="404" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">Q0</text>
  <circle cx="384" cy="154" r="3.4" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <rect x="472" y="74" width="316" height="212" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="630" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Cell 1</text>
  <line x1="480" y1="138" x2="528" y2="138" stroke="#0891b2" stroke-width="1.6" stroke-linecap="round"/>
  <text x="484" y="131" text-anchor="start" font-size="10" font-weight="700" fill="#0891b2">Q1</text>
  <line x1="480" y1="164" x2="528" y2="164" stroke="#4f46e5" stroke-width="1.6" stroke-linecap="round"/>
  <text x="484" y="157" text-anchor="start" font-size="10" font-weight="700" fill="#4f46e5">Q0</text>
  <rect x="528" y="116" width="90" height="76" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="573" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">LUT</text>
  <text x="573" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">0110</text>
  <text x="573" y="180" text-anchor="middle" font-size="8.5" font-weight="400" fill="#b45309">C₃C₂C₁C₀</text>
  <text x="573" y="212" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">F = Q1 XOR Q0</text>
  <line x1="618" y1="154" x2="664" y2="154" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="664" y="128" width="84" height="52" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="677" y="147.76" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">D</text>
  <text x="735" y="147.76" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Q</text>
  <path d="M664,162 L674,168 L664,174" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="748" y1="154" x2="772" y2="154" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round"/>
  <text x="780" y="159" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">Q1</text>
  <circle cx="760" cy="154" r="3.4" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <line x1="288" y1="318" x2="288" y2="168" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="288" cy="318" r="3.2" fill="#334155" stroke="none" stroke-width="1.4"/>
  <line x1="664" y1="318" x2="664" y2="168" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="664" cy="318" r="3.2" fill="#334155" stroke="none" stroke-width="1.4"/>
  <path d="M150,318 L664,318" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M120,318 L150,318" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ac)"/>
  <text x="112" y="322" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a">CLK</text>
  <circle cx="384" cy="154" r="3.4" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <path d="M384,154 L384,352 L60,352 L60,138 L104,138" fill="none" stroke="#4f46e5" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#acf)"/>
  <path d="M384,352 L460,352 L460,164 L480,164" fill="none" stroke="#4f46e5" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#acf)"/>
  <circle cx="384" cy="352" r="3.2" fill="#4f46e5" stroke="none" stroke-width="1.4"/>
  <circle cx="760" cy="154" r="3.4" fill="#0891b2" stroke="none" stroke-width="1.4"/>
  <path d="M760,154 L760,388 L432,388 L432,138 L480,138" fill="none" stroke="#0891b2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#acg)"/>
  <text x="300" y="416" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4f46e5">the routing matrix carries Q0 and Q1 back into both LUTs</text>
  <rect x="610" y="404" width="246" height="82" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="733" y="426" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">Q1 Q0  sequence</text>
  <text x="733" y="450" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">00 → 01 → 10 → 11 → 00</text>
  <text x="733" y="472" text-anchor="middle" font-size="9.5" font-weight="400" fill="#475569">one count per clock edge</text>
  <text x="300" y="448" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a" xml:space="preserve">D0 = Q0'          D1 = Q1 XOR Q0</text>
  <text x="300" y="472" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">each LUT holds just 4 configuration bits</text>
  <text x="440" y="504" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">The counter's flip-flops are the cells' own flip-flops — no extra hardware is added, only 8 configuration bits are changed.</text>
</svg>
