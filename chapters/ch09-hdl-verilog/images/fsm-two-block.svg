<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="Two always block template for writing a finite state machine in Verilog">
  <style>text{font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="860" height="360" fill="#ffffff"/>
  <defs><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="430" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">แม่แบบการเขียน FSM ด้วย Verilog — แยกเป็นสองบล็อกเสมอ</text>
  <text x="40" y="118" text-anchor="start" font-size="11" font-weight="700" fill="#4f46e5">อินพุต</text>
  <path d="M40,130 L156,130" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#as)"/>
  <rect x="156" y="88" width="216" height="84" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
  <text x="264" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">บล็อกที่ 2 — Next-state</text>
  <text x="264" y="134" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="400" fill="#4f46e5" xml:space="preserve">always @(*)</text>
  <text x="264" y="154" text-anchor="middle" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="400" fill="#475569" xml:space="preserve">nxt = f(cur, inputs)</text>
  <path d="M372,130 L436,130" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#as)"/>
  <text x="404" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">nxt</text>
  <rect x="436" y="88" width="216" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="544" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">บล็อกที่ 1 — State register</text>
  <text x="544" y="134" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="400" fill="#16a34a" xml:space="preserve">always @(posedge clk)</text>
  <text x="544" y="154" text-anchor="middle" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="400" fill="#475569" xml:space="preserve">cur &lt;= nxt</text>
  <path d="M652,130 L712,130" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#as)"/>
  <text x="684" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">cur</text>
  <rect x="712" y="88" width="128" height="84" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="776" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Output logic</text>
  <text x="776" y="138" text-anchor="middle" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="400" fill="#b45309" xml:space="preserve">assign y =</text>
  <text x="776" y="156" text-anchor="middle" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="400" fill="#475569" xml:space="preserve">g(cur)</text>
  <path d="M600,172 L600,232 L200,232 L200,172" fill="none" stroke="#16a34a" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#as)"/>
  <text x="400" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#16a34a">ป้อนสถานะปัจจุบันกลับไปคำนวณสถานะถัดไป</text>
  <rect x="112" y="276" width="636" height="62" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="430" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">ทำไมต้องแยกสองบล็อก</text>
  <text x="430" y="322" text-anchor="middle" font-size="10" font-weight="400" fill="#475569">บล็อกนาฬิกาใช้ &lt;= เท่านั้น · บล็อกคอมบิเนชันใช้ = เท่านั้น — ปนกันเมื่อไรวงจรที่สังเคราะห์ได้จะไม่ตรงกับที่จำลอง</text>
</svg>
