  <text x="440" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">= กับ &lt;= ในบล็อกนาฬิกา — โค้ดหน้าตาเหมือนกัน แต่ได้วงจรคนละแบบ</text>
