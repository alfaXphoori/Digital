  <text x="512" y="133" text-anchor="start" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#a5b4fc" xml:space="preserve">b &lt;= a;</text>
