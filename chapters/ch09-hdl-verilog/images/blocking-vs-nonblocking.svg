  <text x="82" y="133" text-anchor="start" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#a5b4fc" xml:space="preserve">b = a;</text>
  <text x="82" y="152" text-anchor="start" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" fill="#a5b4fc" xml:space="preserve">c = b;</text>
  <rect x="452" y="50" width="406" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="655" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">nonblocking  &lt;=</text>
  <rect x="478" y="92" width="354" height="74" rx="6" fill="#0f172a" stroke="none" stroke-width="1.5"/>
