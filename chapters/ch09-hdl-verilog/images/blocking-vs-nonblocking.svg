  <text x="440" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">ผลจำลองจริงจาก Icarus Verilog (ป้อน a = 1 หนึ่งจังหวะแล้วกลับเป็น 0)</text>
